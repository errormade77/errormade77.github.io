<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ERRORMADE</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="home">
    <h1 class="visually-hidden">ERRORMADE</h1>
    <canvas class="home-spray" id="home-spray" aria-hidden="true"></canvas>
    <div class="spray-cursor" id="home-spray-cursor" aria-hidden="true"></div>
    <div class="stage">
      <div class="logo">
        <img src="assets/logo.svg" width="203" height="120" alt="" />
      </div>

      <time class="link link-clock home-hover-target" id="live-clock">00:00:00</time>
      <a class="link link-telegram home-hover-target" href="https://t.me/errormade" target="_blank" rel="noopener noreferrer">telegram</a>
      <a class="link link-instagram home-hover-target" href="https://www.instagram.com/iamerrormade/" target="_blank" rel="noopener noreferrer">instagram</a>
      <a class="link link-ui-works home-hover-target" href="#ui-works">ui works</a>
      <a class="link link-graphic-works home-hover-target" href="#graphic-works">graphic works</a>
      <div class="sandbox-links">
        <a class="link link-sandbox-001 home-hover-target" href="https://errormade77.github.io/sandbox001/" target="_blank" rel="noopener noreferrer">sandbox:001</a>
        <a class="link link-sandbox-002 home-hover-target" href="https://errormade77.github.io/sandbox002/" target="_blank" rel="noopener noreferrer">sandbox:002</a>
      </div>

      <a class="howto-teaser home-hover-target" href="#guide">
        <span class="howto-teaser-image">
          <img src="assets/poster-thumb.jpg" width="52" height="70" alt="" />
        </span>
        <span class="howto-teaser-text">how to throw the errormade
sign</span>
      </a>
    </div>

    <button class="uiworks-params home-params home-hover-target" id="home-params-open" type="button" hidden>parameters</button>
    <div class="params-modal home-params-modal" id="home-params-modal" hidden>
      <div class="params-panel">
        <p class="params-title">parameters</p>
        <label class="params-check">
          <input id="home-hover-blur-toggle" type="checkbox" />
          <span>hover blur</span>
        </label>
        <div id="home-hover-fields" hidden>
          <label class="params-field">
            <span>blur amount</span>
            <span class="params-width-row">
              <input id="home-hover-blur" type="range" min="0" max="24" step="0.5" value="8" />
              <input id="home-hover-blur-number" type="number" min="0" max="24" step="0.5" value="8" />
            </span>
          </label>
          <label class="params-field">
            <span>animation speed</span>
            <span class="params-width-row">
              <input id="home-hover-speed" type="range" min="0" max="2" step="0.01" value="0.22" />
              <input id="home-hover-speed-number" type="number" min="0" max="2" step="0.01" value="0.22" />
            </span>
          </label>
          <label class="params-field">
            <span>hover scale</span>
            <span class="params-width-row">
              <input id="home-hover-scale" type="range" min="-3" max="3" step="0.05" value="1" />
              <input id="home-hover-scale-number" type="number" min="-3" max="3" step="0.05" value="1" />
            </span>
          </label>
          <label class="params-field">
            <span>others scale</span>
            <span class="params-width-row">
              <input id="home-others-scale" type="range" min="-3" max="3" step="0.05" value="1" />
              <input id="home-others-scale-number" type="number" min="-3" max="3" step="0.05" value="1" />
            </span>
          </label>
          <label class="params-check">
            <input id="home-hover-hide-cursor" type="checkbox" />
            <span>hide cursor</span>
          </label>
          <label class="params-check">
            <input id="home-hover-follow" type="checkbox" />
            <span>follow cursor</span>
          </label>
          <label class="params-field" id="home-hover-follow-field" hidden>
            <span>follow amount</span>
            <span class="params-width-row">
              <input id="home-hover-follow-amount" type="range" min="0" max="40" step="1" value="10" />
              <input id="home-hover-follow-amount-number" type="number" min="0" max="40" step="1" value="10" />
            </span>
          </label>
        </div>
        <label class="params-check">
          <input id="home-blend-difference" type="checkbox" />
          <span>difference blend</span>
        </label>
        <label class="params-check">
          <input id="home-spray-toggle" type="checkbox" />
          <span>spray</span>
        </label>
        <div id="home-spray-fields" hidden>
          <label class="params-field">
            <span>brush size</span>
            <span class="params-width-row">
              <input id="home-spray-size" type="range" min="4" max="80" step="1" value="28" />
              <input id="home-spray-size-number" type="number" min="4" max="80" step="1" value="28" />
            </span>
          </label>
          <label class="params-field">
            <span>particles</span>
            <span class="params-width-row">
              <input id="home-spray-particles" type="range" min="1" max="150" step="1" value="22" />
              <input id="home-spray-particles-number" type="number" min="1" max="150" step="1" value="22" />
            </span>
          </label>
          <label class="params-field">
            <span>particle size</span>
            <span class="params-width-row">
              <input id="home-spray-particle-size" type="range" min="0.5" max="12" step="0.1" value="1.5" />
              <input id="home-spray-particle-size-number" type="number" min="0.5" max="12" step="0.1" value="1.5" />
            </span>
          </label>
          <label class="params-field">
            <span>intensity</span>
            <span class="params-width-row">
              <input id="home-spray-intensity" type="range" min="1" max="200" step="1" value="80" />
              <input id="home-spray-intensity-number" type="number" min="1" max="200" step="1" value="80" />
            </span>
          </label>
          <label class="params-field">
            <span>cluster</span>
            <span class="params-width-row">
              <input id="home-spray-cluster" type="range" min="0" max="100" step="1" value="45" />
              <input id="home-spray-cluster-number" type="number" min="0" max="100" step="1" value="45" />
            </span>
          </label>
          <label class="params-field">
            <span>paint liquidity</span>
            <span class="params-width-row">
              <input id="home-spray-liquid" type="range" min="0" max="100" step="1" value="45" />
              <input id="home-spray-liquid-number" type="number" min="0" max="100" step="1" value="45" />
            </span>
          </label>
          <label class="params-field">
            <span>drips</span>
            <span class="params-width-row">
              <input id="home-spray-drips" type="range" min="0" max="40" step="1" value="8" />
              <input id="home-spray-drips-number" type="number" min="0" max="40" step="1" value="8" />
            </span>
          </label>
          <button class="params-upload" id="home-spray-clear" type="button">clear canvas</button>
        </div>
        <button class="close params-close" id="home-params-close" type="button">close</button>
      </div>
    </div>

    <div class="uiworks-window" id="uiworks-window" role="dialog" aria-modal="true" aria-label="ui works" hidden>
      <div class="uiworks-stage">
        <div class="uiworks-column-wrap">
          <div class="uiworks-column" id="uiworks-column">
            <div class="uiworks-scrub" aria-hidden="true"></div>
            <div class="uiworks-block uiworks-block-1"></div>
            <div class="uiworks-block uiworks-block-2"></div>
          </div>
        </div>
        <div class="uiworks-preview" id="uiworks-preview" hidden></div>
        <button class="close" type="button">close</button>
        <button class="uiworks-params" id="uiworks-params-open" type="button" hidden>parameters</button>
      </div>
      <div class="params-modal" id="uiworks-params-modal" hidden>
        <div class="params-panel">
          <p class="params-title">parameters</p>
          <label class="params-field">
            <span>column width</span>
            <span class="params-width-row">
              <input id="uiworks-width" type="range" min="120" max="1400" step="1" value="357" />
              <input id="uiworks-width-number" type="number" min="120" max="1400" step="1" value="357" />
            </span>
          </label>
          <label class="params-field">
            <span>scroll sensitivity</span>
            <span class="params-width-row">
              <input id="uiworks-scroll-sens" type="range" min="0.1" max="4" step="0.1" value="1" />
              <input id="uiworks-scroll-sens-number" type="number" min="0.1" max="4" step="0.1" value="1" />
            </span>
          </label>
          <label class="params-field">
            <span>scroll smoothness</span>
            <span class="params-width-row">
              <input id="uiworks-scroll-smooth" type="range" min="0" max="90" step="1" value="0" />
              <input id="uiworks-scroll-smooth-number" type="number" min="0" max="90" step="1" value="0" />
            </span>
          </label>
          <label class="params-check params-preview-field" id="uiworks-preview-toggle-field">
            <input id="uiworks-preview-toggle" type="checkbox" />
            <span>scroll preview</span>
          </label>
          <label class="params-check params-preview-field" id="uiworks-preview-fill-field" hidden>
            <input id="uiworks-preview-fill" type="checkbox" />
            <span>fill height</span>
          </label>
          <label class="params-field params-preview-field" id="uiworks-preview-width-field" hidden>
            <span id="uiworks-preview-width-label">preview width</span>
            <span class="params-width-row">
              <input id="uiworks-preview-width" type="range" min="200" max="1600" step="1" value="640" />
              <input id="uiworks-preview-width-number" type="number" min="200" max="1600" step="1" value="640" />
            </span>
          </label>
          <button class="params-upload" id="uiworks-upload" type="button">upload media</button>
          <input
            class="visually-hidden"
            id="uiworks-file"
            type="file"
            accept="image/*,video/*,.png,.jpg,.jpeg,.gif,.webp,.avif,.mp4,.webm,.mov,.m4v"
            multiple
          />
          <ul class="params-list" id="uiworks-params-list"></ul>
          <button class="close params-close" id="uiworks-params-close" type="button">close</button>
        </div>
      </div>
    </div>

    <div class="uiworks-window" id="graphicworks-window" role="dialog" aria-modal="true" aria-label="graphic works" hidden>
      <div class="uiworks-stage">
        <div class="uiworks-column-wrap">
          <div class="uiworks-column" id="graphicworks-column">
            <div class="uiworks-scrub" aria-hidden="true"></div>
            <div class="uiworks-block uiworks-block-1"></div>
            <div class="uiworks-block uiworks-block-2"></div>
          </div>
        </div>
        <div class="uiworks-preview" id="graphicworks-preview" hidden></div>
        <button class="close" type="button">close</button>
        <button class="uiworks-params" id="graphicworks-params-open" type="button" hidden>parameters</button>
      </div>
      <div class="params-modal" id="graphicworks-params-modal" hidden>
        <div class="params-panel">
          <p class="params-title">parameters</p>
          <label class="params-field">
            <span>column width</span>
            <span class="params-width-row">
              <input id="graphicworks-width" type="range" min="120" max="1400" step="1" value="520" />
              <input id="graphicworks-width-number" type="number" min="120" max="1400" step="1" value="520" />
            </span>
          </label>
          <label class="params-field">
            <span>scroll sensitivity</span>
            <span class="params-width-row">
              <input id="graphicworks-scroll-sens" type="range" min="0.1" max="4" step="0.1" value="1" />
              <input id="graphicworks-scroll-sens-number" type="number" min="0.1" max="4" step="0.1" value="1" />
            </span>
          </label>
          <label class="params-field">
            <span>scroll smoothness</span>
            <span class="params-width-row">
              <input id="graphicworks-scroll-smooth" type="range" min="0" max="90" step="1" value="0" />
              <input id="graphicworks-scroll-smooth-number" type="number" min="0" max="90" step="1" value="0" />
            </span>
          </label>
          <label class="params-check params-preview-field" id="graphicworks-preview-toggle-field">
            <input id="graphicworks-preview-toggle" type="checkbox" checked />
            <span>scroll preview</span>
          </label>
          <label class="params-check params-preview-field" id="graphicworks-preview-fill-field" hidden>
            <input id="graphicworks-preview-fill" type="checkbox" checked />
            <span>fill height</span>
          </label>
          <label class="params-field params-preview-field" id="graphicworks-preview-width-field" hidden>
            <span id="graphicworks-preview-width-label">preview width</span>
            <span class="params-width-row">
              <input id="graphicworks-preview-width" type="range" min="200" max="1600" step="1" value="400" />
              <input id="graphicworks-preview-width-number" type="number" min="200" max="1600" step="1" value="400" />
            </span>
          </label>
          <button class="params-upload" id="graphicworks-upload" type="button">upload media</button>
          <input
            class="visually-hidden"
            id="graphicworks-file"
            type="file"
            accept="image/*,video/*,.png,.jpg,.jpeg,.gif,.webp,.avif,.mp4,.webm,.mov,.m4v"
            multiple
          />
          <ul class="params-list" id="graphicworks-params-list"></ul>
          <button class="close params-close" id="graphicworks-params-close" type="button">close</button>
        </div>
      </div>
    </div>

    <div class="howto-window" id="guide-window" role="dialog" aria-modal="true" aria-label="how to throw the errormade sign" hidden>
      <div class="howto-stage">
        <div class="howto-poster">
          <img src="assets/poster-howto.jpg" width="245" height="327" alt="" />
        </div>
        <div class="howto-guide">
          <div class="howto-guide-inner">
            <img src="assets/guide.jpg" width="653" height="2058" alt="how to throw the errormade sign" />
          </div>
        </div>
        <button class="close" type="button">close</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
