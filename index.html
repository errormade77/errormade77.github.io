      (function () {
        // Fallbacks only — never overwrite existing localStorage on every load.
        var DEFAULTS = {
          "__stamp": "20260911-ship-current",
          "errormade-graphicworks-column-width": "520",
          "errormade-graphicworks-intro-delay": "0",
          "errormade-graphicworks-intro-large-blur": "12",
          "errormade-graphicworks-intro-large-rise": "20",
          "errormade-graphicworks-intro-large-scale": "1",
          "errormade-graphicworks-intro-small-blur": "12.5",

          "errormade-graphicworks-preview-width": "400",
          "errormade-graphicworks-scroll-preview": "1",
          "errormade-graphicworks-scroll-sens": "2",
          "errormade-graphicworks-scroll-smooth": "90",
          "errormade-home-blend-difference": "1",
          "errormade-home-hover-blur": "8",
          "errormade-home-hover-blur-on": "1",
          "errormade-home-hover-follow": "1",
          "errormade-home-hover-follow-amount": "10",
          "errormade-home-hover-hide-cursor": "0",
          "errormade-home-hover-scale": "1",
          "errormade-home-hover-speed": "0.1",
          "errormade-home-intro-blur": "1",
          "errormade-home-intro-delay": "0",
          "errormade-home-intro-logo-blur": "0",
          "errormade-home-intro-logo-rise": "0",
          "errormade-home-intro-logo-scale": "1",
          "errormade-home-intro-randomize": "1",
          "errormade-home-intro-rest-blur": "24",
          "errormade-home-intro-rest-rise": "20",
          "errormade-home-intro-rest-rise-random": "0",
          "errormade-home-intro-rest-scale": "0.5",
          "errormade-home-intro-scramble": "1",
          "errormade-home-intro-speed": "0.5",
          "errormade-home-others-scale": "1",
          "errormade-home-spray-drips": "8",
          "errormade-home-spray-intensity": "80",
          "errormade-home-spray-liquid": "45",
          "errormade-home-spray-on": "1",
          "errormade-home-spray-particle-size": "1.5",
          "errormade-home-spray-particles": "22",
          "errormade-home-spray-size": "70",
          "errormade-uiworks-column-width": "520",
          "errormade-uiworks-preview-fill-height": "1",
          "errormade-uiworks-preview-width": "400",
          "errormade-uiworks-scroll-preview": "1"
        };
        window.__ERRORMADE_DEFAULTS__ = DEFAULTS;

        function fillMissing(data) {
          if (!data) return;
          Object.keys(data).forEach(function (key) {
            if (key.indexOf("errormade-") !== 0) return;
            try {
              if (localStorage.getItem(key) == null) {
                localStorage.setItem(key, String(data[key]));
              }
            } catch (error) {}
          });
        }

        function applyFromFile(data) {
          if (!data) return;
          var localStamp = null;
          try {
            localStamp = localStorage.getItem("errormade-dev-params-stamp");
          } catch (error) {}
          var fileStamp = data.__stamp != null ? String(data.__stamp) : "";
          // Shared file sync: only replace when the file stamp actually changed.
          if (fileStamp && fileStamp !== String(localStamp || "")) {
            Object.keys(data).forEach(function (key) {
              if (key.indexOf("errormade-") !== 0) return;
              try {
                localStorage.setItem(key, String(data[key]));
              } catch (error) {}
            });
            try {
              localStorage.setItem("errormade-dev-params-stamp", fileStamp);
            } catch (error) {}
            return;
          }
          fillMissing(data);
        }

        fillMissing(DEFAULTS);
        try {
          var xhr = new XMLHttpRequest();
          xhr.open("GET", "dev-params.json?t=" + Date.now(), false);
          xhr.send(null);
          if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText) {
            applyFromFile(JSON.parse(xhr.responseText));
          }
        } catch (error) {}

        function readNum(key, fallback) {
          try {
            var raw = localStorage.getItem(key);
            if (raw == null && DEFAULTS[key] != null) raw = DEFAULTS[key];
            if (raw == null) return fallback;
            var value = Number(raw);
            return isFinite(value) ? value : fallback;
          } catch (error) {
            return fallback;
          }
        }
        var blur = readNum("errormade-home-intro-logo-blur", 0);
        var rise = readNum("errormade-home-intro-logo-rise", 0);
        var scale = readNum("errormade-home-intro-logo-scale", 1);
        if (blur <= 0 && rise <= 0 && Math.abs(scale - 1) < 0.001) {
          document.documentElement.classList.add("is-logo-intro-skip");
        }
      })();
